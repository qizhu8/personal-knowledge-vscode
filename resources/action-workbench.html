function renderGraph(){
	byId('name').value=graph.name;
	byId('blocks').innerHTML=graph.nodes.map(node=>{const action=definition(node)||{},collapsed=!!node.collapsed;return '<article class="block '+(collapsed?'collapsed':'')+'" data-block="'+node.id+'" style="left:'+node.x+'px;top:'+node.y+'px"><header><button class="icon" data-fold="'+node.id+'" title="'+(collapsed?'Expand parameters':'Collapse parameters')+'" aria-label="'+(collapsed?'Expand':'Collapse')+' parameters for '+node.id+'" aria-expanded="'+!collapsed+'">'+(collapsed?'&#9656;':'&#9662;')+'</button><h3>'+esc(action.display_name||node.action_id)+'</h3><button class="icon" data-delete="'+node.id+'" title="Delete block" aria-label="Delete '+node.id+'">&times;</button></header><div class="state">'+esc(action.availability?.state||'module_not_loaded')+(collapsed?' / '+Object.keys(properties(action,'input')).length+' inputs / '+Object.keys(properties(action,'output')).length+' outputs':'')+'</div><div class="ports">'+(collapsed?compactPorts(node,action,'input')+compactPorts(node,action,'output'):Object.entries(properties(action,'input')).map(([field,schema])=>parameterRow(node,action,field,schema)).join('')+Object.entries(properties(action,'output')).map(([field,schema])=>'<div class="port-row output-row">'+pin(node,field,schema,'output')+esc(field)+' <small>'+esc(schema.format||schema.type)+'</small></div>').join(''))+'</div></article>'}).join('');
	byId('output').innerHTML=graph.nodes.map(node=>'<option value="'+node.id+'" '+(graph.output_node===node.id?'selected':'')+'>'+esc(definition(node)?.display_name||node.action_id)+' / '+node.id.slice(-4)+'</option>').join('');
	 for(const node of graph.nodes.filter(item=>item.action_id==='core.math-expression')){
	  const example=definition(node).examples[0],row=document.createElement('div');row.className='math-example';
	  row.innerHTML='<code>'+esc(example.inputs.expression)+' = '+esc(example.output.value)+'</code><button class="icon" type="button" title="Apply math example" aria-label="Apply math example"><i class="codicon codicon-lightbulb" aria-hidden="true"></i></button>';
	  document.querySelector('[data-block="'+node.id+'"] .ports').before(row);
	  row.querySelector('button').onclick=()=>{if(graph.edges.some(edge=>edge.target===node.id))return status('Disconnect math inputs before applying the example.',true);remember();node.parameters=structuredClone(example.inputs);persist();renderGraph()};
	 }
	for(const node of graph.nodes){if(!node.value_type)continue;const row=document.createElement('label');row.className='component-type';const label=node.action_id==='core.cast'?'Target type':'Value type';row.innerHTML=label+' <select data-value-type="'+node.id+'" aria-label="'+label+' for '+node.id+'">'+['string','integer','number','boolean','object','array','null'].map(type=>'<option '+(type===node.value_type?'selected':'')+'>'+type+'</option>').join('')+'</select>';document.querySelector('[data-block="'+node.id+'"] .ports').before(row);row.querySelector('select').onchange=event=>{remember();node.value_type=event.target.value;if(node.action_id==='core.constant')node.parameters.value=initialValue(properties(definition(node),'input').value);if(node.action_id==='core.cast')node.parameters.target_type=node.value_type;persist();renderGraph()}}
	document.querySelectorAll('[data-fold]').forEach(button=>{button.innerHTML='<i class="codicon codicon-chevron-'+(button.getAttribute('aria-expanded')==='true'?'down':'right')+'" aria-hidden="true"></i>';button.onclick=()=>{const node=graph.nodes.find(item=>item.id===button.dataset.fold);node.collapsed=!node.collapsed;saveView();renderGraph()}});
	document.querySelectorAll('[data-compact]').forEach(select=>select.onchange=()=>{graph.nodes.find(node=>node.id===select.dataset.node)['compact_'+select.dataset.compact]=select.value;saveView();renderGraph()});
	document.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>{remember();graph.nodes=graph.nodes.filter(node=>node.id!==button.dataset.delete);graph.edges=graph.edges.filter(edge=>edge.source!==button.dataset.delete&&edge.target!==button.dataset.delete);clearSelection();if(graph.output_node===button.dataset.delete)graph.output_node=graph.nodes.at(-1)?.id;persist();renderGraph()});
	document.querySelectorAll('[data-output]').forEach(button=>{button.onclick=()=>pickOutput(button.dataset.blockId,button.dataset.output);button.onpointerdown=event=>{if(event.button!==0)return;wireGesture={node:button.dataset.blockId,field:button.dataset.output,x:event.clientX,y:event.clientY,moved:false};source={node:wireGesture.node,field:wireGesture.field};selectedEdge=null;updatePortState()}});
	document.querySelectorAll('[data-input]').forEach(button=>button.onclick=()=>pickInput(button.dataset.blockId,button.dataset.input));
	document.querySelectorAll('[data-enable-field]').forEach(input=>input.onchange=()=>{remember();const node=graph.nodes.find(item=>item.id===input.dataset.node);if(input.checked)node.parameters[input.dataset.enableField]=initialValue(properties(definition(node),'input')[input.dataset.enableField]);else delete node.parameters[input.dataset.enableField];persist();renderGraph()});
	document.querySelectorAll('[data-field]').forEach(input=>{
		const change=()=>{const node=graph.nodes.find(item=>item.id===input.dataset.node),schema=properties(definition(node),'input')[input.dataset.field];let value=input.value;try{if(schema.enum||(input.tagName==='TEXTAREA'&&schema.type!=='string'))value=JSON.parse(value);else if(schema.type==='boolean')value=input.checked;else if(schema.type==='integer'||schema.type==='number'){value=Number(value);if(input.value.trim()===''||!Number.isFinite(value)||(schema.type==='integer'&&!Number.isSafeInteger(value)))throw Error('Use a finite, exactly representable value.')}}catch(error){input.setCustomValidity(error.message);input.reportValidity();return}remember();node.parameters[input.dataset.field]=value;input.setCustomValidity('');if(input.hasAttribute('data-raw-string'))input.previousElementSibling.innerHTML=literalHighlights(value);persist();draw()};
		input.onchange=()=>{change();if(input.hasAttribute('data-math-expression')&&!input.validationMessage)renderGraph()};
		if(input.hasAttribute('data-math-expression')){input.oninput=()=>{change();const sources=definition(graph.nodes.find(item=>item.id===input.dataset.node)).math_functions;input.previousElementSibling.innerHTML=mathHighlights(input.value,sources);input.parentElement.nextElementSibling.innerHTML=mathProvenance(input.value,sources)};input.onscroll=()=>{input.previousElementSibling.scrollTop=input.scrollTop;input.previousElementSibling.scrollLeft=input.scrollLeft}};
		if(input.hasAttribute('data-raw-string')){input.oninput=change;input.onscroll=()=>{input.previousElementSibling.scrollTop=input.scrollTop;input.previousElementSibling.scrollLeft=input.scrollLeft}};
	});
	document.querySelectorAll('.block header').forEach(header=>header.onpointerdown=event=>{if(event.target.closest('button,select,input'))return;remember();const node=graph.nodes.find(item=>item.id===header.parentElement.dataset.block),start={x:event.clientX,y:event.clientY,left:node.x,top:node.y};header.setPointerCapture(event.pointerId);header.onpointermove=move=>{node.x=Math.max(20,start.left+move.clientX-start.x);node.y=Math.max(20,start.top+move.clientY-start.y);header.parentElement.style.left=node.x+'px';header.parentElement.style.top=node.y+'px';draw()};header.onpointerup=()=>{header.onpointermove=null;saveView()}});
	updatePortState();byId('toggle-parameters').innerHTML='<i class="codicon codicon-'+(graph.nodes.length&&graph.nodes.every(node=>node.collapsed)?'expand-all':'collapse-all')+'" aria-hidden="true"></i>';draw();
}
function clearSelection(){source=null;pendingInput=null;selectedEdge=null;wireGesture=null}
function pickOutput(node,field){source={node,field};selectedEdge=null;if(pendingInput)return connect(pendingInput.node,pendingInput.field);updatePortState();draw()}
function pickInput(node,field){if(source)return connect(node,field);pendingInput={node,field};selectedEdge=null;updatePortState();draw()}
function updatePortState(){const outputNode=source&&graph.nodes.find(node=>node.id===source.node),inputNode=pendingInput&&graph.nodes.find(node=>node.id===pendingInput.node);document.querySelectorAll('.pin').forEach(button=>{const node=graph.nodes.find(item=>item.id===button.dataset.blockId),isInput=button.hasAttribute('data-input'),field=button.dataset[isInput?'input':'output'];button.classList.toggle('compatible',!!(isInput&&outputNode&&compatible(outputNode,source.field,node,field)||!isInput&&inputNode&&compatible(node,field,inputNode,pendingInput.field)));button.classList.toggle('pending',!!(isInput&&pendingInput?.node===node.id&&pendingInput.field===field||!isInput&&source?.node===node.id&&source.field===field))});byId('wire-state').textContent=source?source.field+' -> ...':pendingInput?'... -> '+pendingInput.field:selectedEdge?selectedEdge.output+' -> '+selectedEdge.input:'';byId('cancel-wire').hidden=!source&&!pendingInput;byId('delete-wire').disabled=!selectedEdge;const collapsed=graph.nodes.length&&graph.nodes.every(node=>node.collapsed);byId('toggle-parameters').title=collapsed?'Expand all parameter lists':'Collapse all parameter lists';byId('toggle-parameters').setAttribute('aria-label',byId('toggle-parameters').title)}
function connect(target,input){if(!source)return;const from=graph.nodes.find(node=>node.id===source.node),to=graph.nodes.find(node=>node.id===target);if(!from||!to||!compatible(from,source.field,to,input))return status('Incompatible ports; select a conversion block.',true);remember();graph.edges=graph.edges.filter(edge=>edge.target!==target||edge.input!==input);graph.edges.push({source:source.node,output:source.field,target,input});clearSelection();persist();renderGraph()}
function removeSelectedEdge(){if(!selectedEdge)return;remember();graph.edges=graph.edges.filter(edge=>edge!==selectedEdge);clearSelection();persist();renderGraph()}
function portElement(node,field,direction){return document.querySelector('[data-'+direction+'="'+CSS.escape(field)+'"][data-block-id="'+node+'"]')||document.querySelector('[data-compact-pin="'+direction+'"][data-block-id="'+node+'"]')}
function draw(){
	const canvas=byId('canvas'),origin=canvas.getBoundingClientRect();canvas.style.width=Math.max(1000,...graph.nodes.map(node=>node.x+320))+'px';canvas.style.height=Math.max(700,...graph.nodes.map(node=>node.y+(document.querySelector('[data-block="'+node.id+'"]')?.offsetHeight||200)+60))+'px';
	const curve=(sourceX,sourceY,targetX,targetY)=>'M '+sourceX+' '+sourceY+' C '+(sourceX+80)+' '+sourceY+','+(targetX-80)+' '+targetY+','+targetX+' '+targetY;
	byId('connections').innerHTML=graph.edges.map((edge,index)=>{const from=portElement(edge.source,edge.output,'output'),to=portElement(edge.target,edge.input,'input');if(!from||!to)return '';const sourceBounds=from.getBoundingClientRect(),targetBounds=to.getBoundingClientRect(),label=edge.source+'.'+edge.output+' to '+edge.target+'.'+edge.input;return '<path class="'+(edge===selectedEdge?'selected':'')+'" data-edge="'+index+'" tabindex="0" role="button" aria-label="'+esc(label)+'" d="'+curve(sourceBounds.left-origin.left+7,sourceBounds.top-origin.top+7,targetBounds.left-origin.left+7,targetBounds.top-origin.top+7)+'"><title>'+esc(label)+'</title></path>'}).join('');
	if(wireGesture?.moved){const from=portElement(wireGesture.node,wireGesture.field,'output');if(from){const bounds=from.getBoundingClientRect();byId('connections').innerHTML+='<path class="ghost" d="'+curve(bounds.left-origin.left+7,bounds.top-origin.top+7,wireGesture.pointerX-origin.left,wireGesture.pointerY-origin.top)+'"/>'}}
	document.querySelectorAll('[data-edge]').forEach(path=>{const select=()=>{clearSelection();selectedEdge=graph.edges[+path.dataset.edge];updatePortState();draw()};path.onclick=select;path.onkeydown=event=>{if(['Enter',' '].includes(event.key)){event.preventDefault();select()}}});
}
window.addEventListener('pointermove',event=>{if(!wireGesture)return;wireGesture.moved=wireGesture.moved||Math.hypot(event.clientX-wireGesture.x,event.clientY-wireGesture.y)>5;wireGesture.pointerX=event.clientX;wireGesture.pointerY=event.clientY;draw()});
window.addEventListener('pointerup',event=>{if(!wireGesture)return;const dragged=wireGesture.moved;wireGesture=null;if(dragged){const input=document.elementFromPoint(event.clientX,event.clientY)?.closest('[data-input]');if(input)connect(input.dataset.blockId,input.dataset.input);draw()}});
window.addEventListener('pointercancel',()=>{wireGesture=null;draw()});
window.addEventListener('keydown',event=>{if(event.target.closest('input,select,textarea,[contenteditable]'))return;if(event.key==='Escape'){clearSelection();updatePortState();draw()}else if(event.key==='Delete'||event.key==='Backspace'){if(selectedEdge){event.preventDefault();removeSelectedEdge()}}});
byId('cancel-wire').onclick=()=>{clearSelection();updatePortState();draw()};byId('delete-wire').onclick=removeSelectedEdge;byId('toggle-parameters').onclick=()=>{const collapse=!graph.nodes.every(node=>node.collapsed);graph.nodes.forEach(node=>node.collapsed=collapse);saveView();renderGraph()};
byId('cancel-wire').innerHTML='<i class="codicon codicon-close" aria-hidden="true"></i>';byId('delete-wire').innerHTML='<i class="codicon codicon-debug-disconnect" aria-hidden="true"></i>';
byId('undo').addEventListener('click',()=>{clearSelection();updatePortState();draw()});
byId('palette').addEventListener('click',event=>{if(event.target.closest('[data-edit]')){saveView();clearSelection();updatePortState();draw()}});
function renderQueue(){byId('queue').innerHTML=(queue.jobs||[]).slice(0,30).map(job=>'<tr><td>'+esc(job.action_id)+'</td><td title="'+esc(job.error||'')+'">'+esc(job.stage)+' / '+esc(job.state)+'</td><td>'+['Demand','Graph','ModuleSet','Idle'][job.priority]+'</td><td>'+(['queued','running'].includes(job.state)?'<button data-cancel="'+job.job_id+'">Cancel</button>':'')+'</td></tr>').join('');document.querySelectorAll('[data-cancel]').forEach(button=>button.onclick=()=>perform('cancel_validation',{job_id:button.dataset.cancel}))}
async function renderChoices(runId){
 const data=await request('choices',{run_id:runId});
 for(const choice of data.requests){
  if(seenChoices.has(choice.request_id))continue;
  seenChoices.add(choice.request_id);chat.hidden=false;
  const message=document.createElement('form');message.className='chat-message';
  const options=document.createElement('fieldset');options.className='chat-options';
  const prompt=document.createElement('legend');prompt.textContent=choice.prompt;options.append(prompt);
  choice.options.forEach((option,index)=>{
   const label=document.createElement('label'),input=document.createElement('input');
   input.type='radio';input.name=choice.request_id;input.value=index;input.required=true;input.dataset.choice=choice.request_id;
   label.append(input,document.createTextNode(option.label));options.append(label);
  });
  const submit=document.createElement('button');submit.type='submit';submit.textContent='Submit';submit.dataset.choice=choice.request_id;
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel run';cancel.dataset.choice=choice.request_id;
  const reply=document.createElement('div');reply.className='chat-answer';reply.setAttribute('role','status');
  const lock=disabled=>message.querySelectorAll('input,button').forEach(item=>item.disabled=disabled);
  message.onsubmit=async event=>{
   event.preventDefault();const selected=options.querySelector('input:checked');if(!selected)return;
   lock(true);
   try{await request('answer_choice',{run_id:choice.run_id,request_id:choice.request_id,index:Number(selected.value)});reply.textContent=choice.options[Number(selected.value)].label;await refresh()}
   catch(error){lock(false);status(error.message,true)}
  };
  cancel.onclick=async()=>{
   lock(true);
   try{await request('cancel_run',{run_id:runId});reply.textContent='Run cancellation requested';await refresh()}
   catch(error){lock(false);status(error.message,true)}
  };
  message.append(options,submit,cancel,reply);byId('chat-messages').append(message);
 }
}
async function refresh(){if(refreshing)return;refreshing=true;try{const data=await request('catalog');actions=data.actions;groups=data.groups||[...new Set(['Actions','core',...actions.map(action=>action.category||'Actions')])];moduleSets=data.module_sets;queue=data.queue;previewWorkspace=data.preview_workspace||'';if(previewWorkspace){byId('workspace').disabled=true;byId('workspace').title=previewWorkspace}renderPalette();renderSets();if(!byId('blocks').contains(document.activeElement)&&document.activeElement!==byId('name')&&!wireGesture)renderGraph();renderQueue();if(currentRun){const result=await request('run',{run_id:currentRun});byId('result').textContent=JSON.stringify(result.output||{state:result.state,error:result.error},null,2);if(result.state==='running')await renderChoices(currentRun);else{if(cancellingRun===currentRun)status('Cancelled '+currentRun);currentRun=null;cancellingRun=null;saveView();document.querySelectorAll('[data-choice]').forEach(control=>control.disabled=true)}}updateRunControls();if(byId('status').textContent==='Connecting')status('Loaded '+actions.length+' blocks')}catch(error){status(error.message,true)}finally{refreshing=false}}
async function perform(method,params={}){try{const result=await request(method,params);await refresh();return result}catch(error){status(error.message,true)}}
byId('search').oninput=renderPalette;
let findReturnFocus=null;
function closeFind(){byId('action-find').hidden=true;byId('search').value='';renderPalette();findReturnFocus?.focus();findReturnFocus=null}
byId('close-find').onclick=closeFind;
window.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='f'){event.preventDefault();if(byId('action-find').hidden)findReturnFocus=document.activeElement;byId('action-find').hidden=false;byId('search').focus();byId('search').select()}else if(event.key==='Escape'&&!byId('action-find').hidden){event.preventDefault();closeFind()}});
byId('toggle-tree').onclick=()=>{const collapsed=document.querySelector('.layout').classList.toggle('tree-collapsed');const button=byId('toggle-tree');button.setAttribute('aria-expanded',String(!collapsed));button.title=button.ariaLabel=collapsed?'Expand category tree':'Collapse category tree';button.firstElementChild.className='codicon codicon-chevron-'+(collapsed?'right':'left')};
byId('refresh').onclick=refresh;
byId('workspace').onclick=async()=>{if(vscode)return perform('workspace');const data=await perform('catalog');if(data){hostWorkspace=data.workspace_root||'';byId('workspace-path').value=hostWorkspace;byId('workspace-dialog').showModal()}};
byId('close-workspace').onclick=()=>byId('workspace-dialog').close();
byId('workspace-form').onsubmit=async event=>{event.preventDefault();if(await perform('workspace',{root:byId('workspace-path').value}))byId('workspace-dialog').close()};
byId('import').onclick=()=>vscode?perform('import'):byId('import-dialog').showModal();
byId('close-import').onclick=()=>byId('import-dialog').close();
byId('import-form').onsubmit=async event=>{event.preventDefault();if(await perform('import',{local_path:byId('import-path').value}))byId('import-dialog').close()};
byId('resume').onclick=()=>perform('resume_validation');
byId('undo').onclick=()=>{if(history.length){graph=history.pop();persist();renderGraph()}};
byId('arrange').onclick=()=>{remember();let top=40;graph.nodes.forEach((node,index)=>{if(index&&index%3===0)top+=Math.max(...graph.nodes.slice(index-3,index).map(item=>document.querySelector('[data-block="'+item.id+'"]')?.offsetHeight||300))+40;node.x=40+(index%3)*340;node.y=top});persist();renderGraph()};
byId('name').onchange=()=>{graph.name=byId('name').value;persist()};
byId('output').onchange=()=>{graph.output_node=byId('output').value;persist()};
byId('check').onclick=async()=>{const result=await perform('check_graph',{graph});if(result)status('Graph contract is valid')};
byId('save').onclick=async()=>{const result=await perform('save_graph',{graph:{...graph,version:(actions.find(action=>action.action_id===graph.action_id)?.version||0)+1}});if(result){saved=result;graph.version=result.version;saveView();status('Saved v'+result.version)}};
byId('validate').onclick=async()=>{if(!saved)return status('Save the current graph first.',true);const effects=saved.effects.some(effect=>effect!=='pure');if(effects&&!confirm('Run the declared tests with these effects: '+saved.effects.join(', ')+'?'))return;await perform('validate',{action_id:saved.action_id,content_hash:saved.content_hash,priority:'graph',allow_effects:effects})};
byId('run').onclick=async()=>{if(!saved||currentRun||startingRun)return;startingRun=true;updateRunControls();try{const result=await perform('call',{action_id:saved.action_id,inputs:{},key:crypto.randomUUID(),content_hash:saved.content_hash});if(result){currentRun=result.run_id;saveView();status('Running '+currentRun)}}finally{startingRun=false;updateRunControls()}};
byId('destination-label').hidden=!!vscode;
byId('export').onclick=()=>{if(!selectedExports.size)return status('Select Actions to export.',true);if(!byId('package-path').value&&previewWorkspace)byId('package-path').value=previewWorkspace+'/'+byId('package-id').value+'.pkm-actions';byId('package-dialog').showModal()};
byId('close-package').onclick=()=>byId('package-dialog').close();
byId('package-form').onsubmit=async event=>{event.preventDefault();const params={module_set_id:byId('package-id').value,version:+byId('package-version').value,action_ids:[...selectedExports]};if(!vscode&&byId('package-path').value)params.destination=byId('package-path').value;const result=await perform('export',params);if(result)byId('package-dialog').close()};
async function initialize(){if(browserToken){try{const session=await request('session');if(!initialView&&session.draft){graph=session.draft.graph||graph;saved=session.draft.saved||null;currentRun=session.draft.currentRun||null;editorState=session.draft.editorState||null;saveView()}}catch(error){return status(error.message,true)}}if(editorState)showDefinitionEditor();await refresh()}
window.addEventListener('resize',draw);initialize();setInterval(()=>{if(currentRun||(queue.jobs||[]).some(job=>['queued','running'].includes(job.state)))refresh()},2000);
</script></body></html>
